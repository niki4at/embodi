<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sody Home · 07 Orbit goals</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .orbit-page {
    background: var(--cream);
    color: var(--ink);
    padding-bottom: 120px;
  }
  .top {
    padding: 54px 22px 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .top h1 { font-size: 34px; }
  .top .ask {
    background: var(--lime); border-radius: 999px; padding: 8px 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
  }
  .solar {
    position: relative;
    height: 340px;
    margin: 10px 0 20px;
  }
  .sun {
    position: absolute; left: 50%; top: 50%;
    width: 150px; height: 150px; margin: -75px 0 0 -75px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(74,67,236,.35);
    z-index: 3;
  }
  .sun img { width: 100%; height: 100%; object-fit: cover; }
  .sun .label {
    position: absolute; inset: auto 0 0 0;
    background: linear-gradient(transparent, rgba(23,22,58,.85));
    color: #fff; padding: 18px 10px 12px; text-align: center;
  }
  .sun .label b { display: block; font-family: Fredoka, sans-serif; font-size: 14px; }
  .sun .label span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .ring {
    position: absolute; left: 50%; top: 50%;
    border: 1.5px dashed rgba(74,67,236,.35);
    border-radius: 50%;
    transform: translate(-50%,-50%);
  }
  .r1 { width: 220px; height: 220px; animation: spin-slow 28s linear infinite; }
  .r2 { width: 300px; height: 300px; animation: spin-slow 40s linear infinite reverse; }
  .planet {
    position: absolute; width: 72px; height: 72px;
    border-radius: 50%;
    display: grid; place-items: center;
    text-align: center;
    font-family: Fredoka, sans-serif;
    font-size: 11px;
    line-height: 1.15;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  .p1 { background: var(--lav); left: 18px; top: 70px; animation: float 3.5s ease-in-out infinite; }
  .p2 { background: var(--peri); right: 24px; top: 50px; animation: float 4s ease-in-out infinite .4s; }
  .p3 { background: var(--lime); left: 40px; bottom: 36px; animation: float 3.2s ease-in-out infinite .2s; }
  .p4 {
    background: var(--blue); color: var(--cream);
    right: 36px; bottom: 48px; animation: float 3.8s ease-in-out infinite .6s;
  }
  .cta-row {
    display: flex; gap: 10px; justify-content: center;
    padding: 0 22px 24px;
  }
  .photo-band {
    height: 160px; position: relative; overflow: hidden;
  }
  .photo-band img { width: 100%; height: 100%; object-fit: cover; }
  .photo-band .txt {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 20px;
    background: linear-gradient(90deg, rgba(50,75,62,.8), transparent);
    color: #fff;
  }
  .stats {
    display: grid; grid-template-columns: repeat(4,1fr);
    text-align: center; padding: 22px 10px;
  }
  .stats strong { font-family: Fredoka, sans-serif; font-size: 22px; display: block; }
  .stats span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
  .links { padding: 0 22px 30px; }
  .links a {
    display: block; padding: 14px 0;
    border-top: 1px solid rgba(23,22,58,.1);
    text-decoration: none; color: inherit;
    font-family: Fredoka, sans-serif; font-size: 16px;
  }
  .links a span { display: block; font-family: Lekton, monospace; font-size: 12px; opacity: .55; font-weight: 400; margin-top: 2px; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-scroll orbit-page">
        <div class="island"></div>
        <header class="top anim-up">
          <div>
            <div class="meta-label">Good morning</div>
            <h1>Irene</h1>
          </div>
          <div class="ask">✦ ASK</div>
        </header>
        <div class="solar anim-up d2">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="planet p1">Gain<br/>20%</div>
          <div class="planet p2">10K<br/>25%</div>
          <div class="planet p3">＋ Log</div>
          <div class="planet p4">〜 Calm</div>
          <div class="sun">
            <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=600&q=75&auto=format&fit=crop" alt="Next session" />
            <div class="label"><b>Upper body</b><span>32 min · Start</span></div>
          </div>
        </div>
        <div class="cta-row anim-up d3">
          <button class="cta cta-ink">Start session</button>
          <button class="cta" style="background:var(--lav);color:var(--ink)">Adjust today</button>
        </div>
        <div class="photo-band anim-up d4">
          <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=900&q=70&auto=format&fit=crop" alt="Desk reset" />
          <div class="txt">
            <div class="meta-label">At your desk</div>
            <b style="font-family:Fredoka,sans-serif;font-size:20px">3-min neck reset</b>
          </div>
        </div>
        <div class="stats anim-up d5">
          <div><strong>4</strong><span>Sessions</span></div>
          <div><strong>6.1h</strong><span>Sleep</span></div>
          <div><strong>6.2t</strong><span>Volume</span></div>
          <div><strong>3wk</strong><span>Streak</span></div>
        </div>
        <div class="links">
          <a href="#">Mobility flow<span>Hips have been tight</span></a>
          <a href="#">Easy 20 min run<span>Recovery toward 10K</span></a>
        </div>
      </div>
      <nav class="tabbar">
        <span><i class="dot">◎</i>Social</span>
        <span class="active"><i class="dot">●</i>Home</span>
        <span><i class="dot">◎</i>Goals</span>
        <span><i class="dot">◎</i>You</span>
      </nav>
    </div>
    <div class="caption">07 · Orbit goals — session as sun, goals as planets</div>
  </div>
</div>
</body>
</html>
